notes: >-
  Zero changelogs across the whole institution-operated estate is the finding. Columbia is
  unusually good at publishing its source code — the cul GitHub organisation carries 225 public
  repositories including the full application behind the Hours API — and unusually silent about
  what it means for a consumer. The source trail is a substitute a determined developer can use
  and an agent cannot.
