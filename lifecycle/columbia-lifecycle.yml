description: >-
  Versioning, change communication and deprecation posture across the surfaces Columbia
  University operates. There is no institution-wide API lifecycle practice, no changelog, no
  deprecation policy and no version negotiation on any Columbia surface. What exists instead is
  path versioning on one small API and an unusually open source-code trail.
