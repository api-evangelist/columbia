- aid: columbia:academic-commons
  name: Columbia Academic Commons
  description: >-
    Columbia University's institutional research repository, holding the scholarly output, theses and
    research data of the university. Unusually for this cohort it is NOT a vendor tenancy: it runs on
    Hyrax/Blacklight — open-source repository software the Libraries help maintain — on Columbia's own
    host and hardware, with Columbia's own DOIs. The repository is therefore institution-operated in full.
