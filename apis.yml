x-coverage:
  state: covered
  reason: thin_but_fully_probed
  detail: >-
    Columbia University's programmable footprint is small, and this profile is thin because the
    footprint is thin, not because the probe failed. More than forty URLs were fetched
    successfully across fourteen Columbia hosts, and the institution's one public API was
    exercised end to end including both error paths. What was found is genuinely Columbia's: a
    live two-operation JSON API with CORS enabled at hours.library.columbia.edu, a production
    Shibboleth IdP publishing SAML 2.0 metadata under the InCommon entityID
    urn:mace:incommon:columbia.edu, a CC0 MARCXML bulk release of the entire CLIO catalogue
    across 108 files, and Columbia's own DataCite prefix 10.7916 and Crossref membership 6984.
    Four of the twelve education-regime domain standards were confirmed against
    institution-operated surfaces, which is an unusually strong result for this cohort.


    Two access limits are recorded as findings about our reach, not about Columbia. The central
    columbia.edu Drupal estate — www, the Open Data Service, CUIT, the Provost, university
    policies, news and ai.columbia.edu — sits behind a Cloudflare managed challenge returning 403
    to every non-browser client including one presenting full browser navigation headers, so the
    Open Data Service documentation, the AI guidance and the acceptable-use policy could not be
    read and are not claimed as verified content. Separately, Columbia University Libraries has
    deployed the Anubis proof-of-work challenge in front of its Blacklight discovery estate —
    clio.columbia.edu, academiccommons.columbia.edu and geodata.library.columbia.edu — which
    returns HTTP 200 with a bot-check body for every path. That is why oai-pmh is recorded as
    not_confirmed rather than credited, and why no scored pointer is emitted to any Anubis host:
    a 200 with an identical body on every path is indistinguishable from a soft-404 to an
    automated prober and would grade as dead.


    Genuine absences, verified: no OpenAPI is published by Columbia for anything; no llms.txt, no
    ai.txt and no .well-known/api-catalog on any host; no security.txt on www.columbia.edu or
    library.columbia.edu; no robots.txt on either (hours.library.columbia.edu serves the stock
    empty Rails template); no OpenID Connect discovery document on the identity estate; no SCIM
    endpoint; no MCP server, agent card or agent skills; and no changelog or deprecation policy on
    any institution-operated surface. api.columbia.edu and data.columbia.edu do not resolve.
    api.library.columbia.edu resolves and serves a page whose entire body is the words "API Home.
    CUL API." with a 404 placeholder beneath every path.
