---
aid: columbia
name: Columbia University
description: >-
  Columbia University is a private Ivy League research university in New York City, ranked
  seventeenth in the QS World University Rankings. Its programmable footprint is small, real, and
  almost entirely invisible from the outside. Columbia operates exactly one publicly consumable,
  unauthenticated API of its own: the Columbia University Libraries Hours API at
  hours.library.columbia.edu, two read operations returning JSON with CORS enabled, built on
  Columbia's own openly published Rails codebase and documented by nobody. Alongside it the
  university runs a production Shibboleth Identity Provider that publishes signed SAML 2.0
  metadata under the InCommon entityID urn:mace:incommon:columbia.edu, mints DOIs under its own
  DataCite prefix 10.7916 across 1.1 million registered identifiers, deposits into Crossref as
  member 6984, and releases the entire CLIO library catalogue as CC0 MARCXML bulk extracts. That
  is the whole of it. The Open Data Service that Columbia describes as its developer-facing
  service is gated behind a UNI login, and the IRI/LDEO Climate Data Library now redirects its
  data paths to a login form. Columbia publishes no OpenAPI, no developer portal reachable
  without affiliation, no changelog, no llms.txt and no API terms, and it reserves the hostname
  api.library.columbia.edu while serving nothing but a placeholder there. Most consequentially
  for machine access, Columbia defends its estate with two different anti-bot products: a
  Cloudflare managed challenge across the central web estate, and an Anubis proof-of-work
  challenge in front of the Libraries' entire discovery layer — the CLIO catalogue, Academic
  Commons and GeoData — which returns HTTP 200 with a bot-check body and made the institution's
  OAI-PMH endpoint unverifiable. Learning management runs on Instructure's Canvas and the
  research data platform on Redivis; both are tenant relationships, recorded as such and scored
  against their vendors.
