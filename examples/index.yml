- file: columbia-shibboleth-idp-metadata-example.xml
  host: shibboleth.columbia.edu
  x-operator: institution
  status: 200
  content_type: application/xml;charset=UTF-8
  method: probed
  source: https://shibboleth.columbia.edu/idp/shibboleth
  description: >-
    Columbia's production Shibboleth Identity Provider SAML metadata. entityID
    urn:mace:incommon:columbia.edu, shibmd:Scope columbia.edu, protocolSupportEnumeration
    covering SAML 2.0, SAML 1.1 and Shibboleth 1.0, two X.509 key descriptors (signing and
    encryption), four SSO endpoints and a SingleLogoutService that hands off to
    cas.columbia.edu/cas/logout. The single most substantial machine-readable artifact Columbia
    publishes about itself.
- file: columbia-datacite-client-example.json
  host: api.datacite.org
  x-operator: institution
  status: 200
  method: searched
  source: https://api.datacite.org/clients/cul.columbia
  description: >-
    DataCite's registry record for repository client CUL.COLUMBIA — Columbia University
    Libraries, active since 2018, clientType repository, url library.columbia.edu. Evidences
    Columbia's own DOI minting under prefix 10.7916. Retrieved from DataCite because DataCite is
    the registry of record; the fact it evidences is Columbia's.
- file: columbia-crossref-member-example.json
  host: api.crossref.org
  x-operator: institution
  status: 200
  method: searched
  source: https://api.crossref.org/members/6984
  description: >-
    Crossref's member record for Columbia University Libraries (member 6984), carrying its
