notes: >-
  There are no examples here for the Open Data Service, the Directory of Classes, Academic
  Commons or the CLIO discovery layer. That is not an omission — those hosts are either behind a
  UNI login, behind a Cloudflare interstitial, or behind an Anubis proof-of-work challenge, and
  no unauthenticated response body could be captured. See x-coverage in apis.yml.
