generated: '2026-08-19'
method: probed
source: >-
  Live responses captured from Columbia University surfaces on 2026-08-19, plus two third-party
  registry records that evidence Columbia's own DOI infrastructure. Nothing in this folder is
  synthesized; every file is a verbatim response body.
provider: Columbia University
providerId: columbia
description: >-
  Response examples for the surfaces Columbia University actually operates. Five of the eight
  files come from the Libraries Hours API, the only unauthenticated institution-operated JSON API
  found in Columbia's estate. The remaining three evidence identity federation and DOI
  registration.
examples:
