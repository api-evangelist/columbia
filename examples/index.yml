  host: hours.library.columbia.edu
  x-operator: institution
  status: 200
  content_type: application/json; charset=utf-8
  method: probed
  source: https://hours.library.columbia.edu/api/v1/locations/open_now
  description: >-
    Seven Columbia library locations open at capture time, keyed by location code, each carrying
    open_time, close_time and a human formatted_date string.
