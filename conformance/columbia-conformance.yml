notes: >-
  Read the operator column before reading the count. Four of the five confirmed hits — shibboleth,
  saml, datacite and crossref — are genuinely Columbia's own engineering, which is an unusually
  good result for this cohort: most universities' standards hits arrive bundled with a vendor's
  repository platform. Columbia runs its own Shibboleth IdP and mints DOIs under its own DataCite
  prefix and its own Crossref membership. The one tenant hit, LTI 1.3, arrives with Instructure's
  Canvas and would be there whether Columbia had an API practice or not. The notable gap is
  oai-pmh, which Columbia almost certainly operates and which could not be verified because the
  Libraries have deployed an anti-crawler challenge in front of the repository.
