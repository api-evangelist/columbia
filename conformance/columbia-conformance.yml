description: >-
  Domain-standard conformance for Columbia University, read from the artifacts and registry
  records themselves rather than from any prose claim — Columbia makes no conformance claims on
  any public developer surface. Every hit carries the operator of the surface it was found on,
  because a standard implemented by a platform Columbia rents is a fact about the platform first
  and about Columbia second. Reward-only: nothing is asserted that was not observed in a live
